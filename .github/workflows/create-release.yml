name: Create MuktoConnect Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable release version without the v prefix"
        required: true
        default: "0.1.8"
        type: string

permissions:
  contents: write

concurrency:
  group: muktoconnect-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be stable semver like 0.1.8"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check tag state
        id: tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            if ! git merge-base --is-ancestor "$TAG^{commit}" HEAD; then
              echo "::error::Tag $TAG exists but does not point to a commit on main. Refusing to reuse or overwrite it."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists on main history; will reuse it and continue the release build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is available; a new tag will be created after successful validation."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Set package version for release build
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run unit tests
        run: npm run test:unit

      - name: Run streaming integration tests
        run: npm run test:stream

      - name: Package VSIX
        run: npx --yes @vscode/vsce package

      - name: Publish to VS Code Marketplace (optional)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not configured; skipping Marketplace publishing."
            exit 0
          fi
          vsix="$(find . -maxdepth 1 -name '*.vsix' -print -quit)"
          test -n "$vsix" || { echo "::error::VSIX package not found"; exit 1; }
          npx --yes @vscode/vsce publish --packagePath "$vsix" --pat "$VSCE_PAT"

      - name: Publish to Open VSX Registry (optional)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not configured; skipping Open VSX publication."
            exit 0
          fi
          vsix="$(find . -maxdepth 1 -name '*.vsix' -print -quit)"
          test -n "$vsix" || { echo "::error::VSIX package not found"; exit 1; }
          npx --yes ovsx publish "$vsix" -p "$OVSX_PAT"

      - name: Create and push release tag
        if: steps.tag.outputs.exists != 'true'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "MuktoConnect $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release and attach VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" ./*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
