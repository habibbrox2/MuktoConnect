name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/copilot-tool-streaming, test/greeting-diagnostics-model-default]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run streaming integration tests
        run: npm run test:stream

      - name: Package VS Code extension (test build)
        if: github.ref == 'refs/heads/test/greeting-diagnostics-model-default'
        run: npx --yes @vscode/vsce package --no-dependencies --out muktoconnect-test-build.vsix

      - name: Upload test VSIX artifact
        if: github.ref == 'refs/heads/test/greeting-diagnostics-model-default'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: muktoconnect-test-build
          path: muktoconnect-test-build.vsix
          if-no-files-found: error
          retention-days: 7
