name: Release VS Code Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate release tag and set package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable semver tag like v1.2.3; got $GITHUB_REF_NAME"
            exit 1
          fi
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          echo "Packaging MuktoConnect version $TAG_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run unit tests
        run: npm run test:unit

      - name: Run streaming integration tests
        run: npm run test:stream

      - name: Package VSIX
        run: npx --yes @vscode/vsce package

      - name: Publish to VS Code Marketplace (optional)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not configured; skipping Marketplace publishing."
            exit 0
          fi
          vsix="$(find . -maxdepth 1 -name '*.vsix' -print -quit)"
          test -n "$vsix" || { echo "::error::VSIX package not found"; exit 1; }
          npx --yes @vscode/vsce publish --packagePath "$vsix" --pat "$VSCE_PAT"

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is not configured; skipping Open VSX publication."
            exit 0
          fi
          vsix="$(find . -maxdepth 1 -name '*.vsix' -print -quit)"
          test -n "$vsix" || { echo "::error::VSIX package not found"; exit 1; }
          npx --yes ovsx publish "$vsix" -p "$OVSX_PAT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.1.0
        with:
          files: |
            *.vsix
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
